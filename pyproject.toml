[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "word2vec-factory"
version = "0.1.0"
description = "Pluggable factory-mode word2vec with ablation tooling (CBOW/Skip-gram, HS/NS)"
authors = [{ name="Your Name", email="you@example.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1.0",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "pyyaml>=6.0",
  "loguru>=0.7.0",
  "tqdm>=4.66.0",
  "scikit-learn>=1.3.0",
  "tensorboard>=2.12.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["w2v_factory*"]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["*.egg-info", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]